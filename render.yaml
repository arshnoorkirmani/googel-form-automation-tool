services:
  - type: web
    name: dispositions-form-automation
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    plan: starter
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: Dispositions Form Automation
      - key: APP_FORM_URL
        value: https://docs.google.com/forms/d/e/1FAIpQLSeElvHr-D5FXndyGFdk5VrcNKprY_wakDRGlmNJytjInZRaUA/viewform
      - key: DEFAULT_MODE
        value: DRY_RUN
      - key: DEBUG_SLOW_MO_MS
        value: "250"
      - key: MAX_RETRIES
        value: "2"
      - key: MAX_BATCH_ROWS
        value: "50"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: dispositions_form_automation
      - key: AUTH_SESSION_KEY
        value: default
      - key: AUTH_INTERACTIVE_SETUP_ENABLED
        value: "false"
      - key: MONGODB_PERSIST_LOGS
        value: "true"
      - key: MONGODB_PERSIST_SCREENSHOTS
        value: "true"
      - key: MONGODB_PERSIST_RUN_REPORTS
        value: "true"
      - key: PERSIST_LOG_FILES
        value: "false"
      - key: PERSIST_SCREENSHOTS
        value: "false"
      - key: PERSIST_RUN_REPORTS
        value: "false"
